trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop

stages:
  - stage: code_review
    displayName: Dockerfile Lint
    jobs:
      - job: lint_dockerfile
        displayName: Lint Dockerfile
        pool:
          vmImage: ubuntu-latest

        steps:
          - checkout: self
            clean: true

          - script: |
              set -euo pipefail
              docker run --rm \
                -v "$(Build.SourcesDirectory):/workspace" \
                -w /workspace \
                hadolint/hadolint Dockerfile
            displayName: Run hadolint on Dockerfile
