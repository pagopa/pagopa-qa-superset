parameters:
  - name: DEPLOY_ENV
    displayName: Deploy ENV
    type: string
    default: dev
    values:
      - dev
      - uat
#      - prod
  
  - name: SOURCE_IMAGE_TAG
    displayName: 'Source image tag to promote and deploy (DEV -> UAT)'
    type: string
    default: latest

variables:
  DEV_POOL_NAME: 'pagopa-dev-linux'
  UAT_POOL_NAME: 'pagopa-uat-linux'
  PROD_POOL_NAME: 'pagopa-prod-linux'

  IMAGE_NAME: 'pagopa-qa-superset'
  IMAGE_TAG: '$(Build.BuildId)'

  TRIVY_VERSION: '0.74.0'

  HELM_RELEASE_NAME: 'pagopa-qa-superset'
  HELM_CHART_PATH: 'helm'
  AKS_NAMESPACE: 'qa'

trigger: none

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-22.04'

stages:
  - stage: build_and_push_dev
    displayName: Build and Push [DEV]
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'dev')
    jobs:
      - job: buildPushDev
        displayName: Build and push DEV image

        steps:
          - checkout: self
            clean: true

          - script: git checkout $(SOURCE_BRANCH)
            displayName: Checkout source branch

          - task: AzureCLI@2
            displayName: Azure login to DEV ACR
            inputs:
              azureSubscription: '$(DEV_AZURE_SUBSCRIPTION)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name $(DEV_CONTAINER_NAMESPACE)

          - script: |
              set -euxo pipefail
              docker build \
                -t $(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):$(IMAGE_TAG) \
                -t $(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):latest \
                .
              docker push $(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):$(IMAGE_TAG)
              docker push $(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):latest
            displayName: Build and push DEV image

  - stage: trivy_scan_dev
    displayName: Trivy scan [DEV]
    dependsOn: build_and_push_dev
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'dev')
    jobs:
      - job: scanDevImage
        displayName: Scan the DEV image for vulnerabilities
        steps:
          - template: templates/steps-trivy-scan.yml
            parameters:
              azureSubscription: '$(DEV_AZURE_SUBSCRIPTION)'
              acrName: '$(DEV_CONTAINER_NAMESPACE)'
              image: '$(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):$(IMAGE_TAG)'
              trivyVersion: '$(TRIVY_VERSION)'
              continueOnError: true

  - stage: deploy_dev
    displayName: Deploy [DEV]
    dependsOn: trivy_scan_dev
    dependsOn: trivy_scan_dev
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'dev')
    jobs:
      - job: helmDeployDev
        displayName: Helm upgrade on AKS DEV
        pool:
          name: '$(DEV_POOL_NAME)'
        steps:
          - checkout: self
            clean: true

          - task: HelmInstaller@1
            displayName: Install Helm

          - script: |
              helm repo add superset https://apache.github.io/superset
              helm repo update
              helm dependency update ./$(HELM_CHART_PATH)
            displayName: Build Helm chart dependencies

          - task: HelmDeploy@1
            displayName: Helm upgrade to AKS DEV
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceConnection: '$(DEV_AKS_SERVICE_CONNECTION)'
              namespace: '$(AKS_NAMESPACE)'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: '$(HELM_CHART_PATH)'
              releaseName: '$(HELM_RELEASE_NAME)'
              install: true
              valueFile: '$(HELM_CHART_PATH)/values.yaml'
              waitForExecution: true
              arguments: >-
                -f $(HELM_CHART_PATH)/values-dev.yaml
                --set-string superset.image.repository=$(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME)
                --set-string superset.image.tag=$(IMAGE_TAG)
                --timeout 10m

  - stage: trivy_scan_uat
    displayName: Trivy scan [UAT]
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'uat')
    jobs:
      - job: scanUatSourceImage
        displayName: Scan the image to promote for vulnerabilities
        pool:
          name: '$(UAT_POOL_NAME)'
        steps:
          - template: templates/steps-trivy-scan.yml
            parameters:
              azureSubscription: '$(DEV_AZURE_SUBSCRIPTION)'
              acrName: '$(DEV_CONTAINER_NAMESPACE)'
              image: '$(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):${{ parameters.SOURCE_IMAGE_TAG }}'
              trivyVersion: '$(TRIVY_VERSION)'
              continueOnError: true

  - stage: promote_to_uat
    displayName: Promote image [UAT]
    dependsOn: trivy_scan_uat
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'uat')
    jobs:
      - job: promoteUat
        displayName: Promote DEV -> UAT
        pool:
          name: '$(UAT_POOL_NAME)'
        steps:
          - task: AzureCLI@2
            displayName: Pull image from DEV ACR
            inputs:
              azureSubscription: '$(DEV_AZURE_SUBSCRIPTION)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "${DEV_NS%%.*}"
                docker pull "${DEV_NS}/${IMG}:${SRC_TAG}"
            env:
              DEV_NS: $(DEV_CONTAINER_NAMESPACE)
              IMG: $(IMAGE_NAME)
              SRC_TAG: ${{ parameters.SOURCE_IMAGE_TAG }}

          - task: AzureCLI@2
            displayName: Push image to UAT ACR
            inputs:
              azureSubscription: '$(UAT_AZURE_SUBSCRIPTION)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "Pushing ${DEV_NS}/${IMG}:${SRC_TAG} -> ${UAT_NS}/${IMG}"

                az acr login --name "${UAT_NS%%.*}"
                docker tag "${DEV_NS}/${IMG}:${SRC_TAG}" "${UAT_NS}/${IMG}:${SRC_TAG}"
                docker tag "${DEV_NS}/${IMG}:${SRC_TAG}" "${UAT_NS}/${IMG}:latest"
                docker push "${UAT_NS}/${IMG}:${SRC_TAG}"
                docker push "${UAT_NS}/${IMG}:latest"
            env:
              DEV_NS: $(DEV_CONTAINER_NAMESPACE)
              IMG: $(IMAGE_NAME)
              SRC_TAG: ${{ parameters.SOURCE_IMAGE_TAG }}
              UAT_NS: $(UAT_CONTAINER_NAMESPACE)

  - stage: deploy_uat
    displayName: Deploy [UAT]
    dependsOn: promote_to_uat
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'uat')
    jobs:
      - job: helmDeployDev
        displayName: Helm upgrade on AKS UAT
        pool:
          name: '$(UAT_POOL_NAME)'
        steps:
          - checkout: self
            clean: true

          - task: HelmInstaller@1
            displayName: Install Helm

          - script: |
              helm repo add superset https://apache.github.io/superset
              helm repo update
              helm dependency update ./$(HELM_CHART_PATH)
            displayName: Build Helm chart dependencies

          - task: HelmDeploy@1
            displayName: Helm upgrade to AKS UAT
            inputs:
              connectionType: 'Kubernetes Service Connection'
              kubernetesServiceConnection: '$(UAT_AKS_SERVICE_CONNECTION)'
              namespace: '$(AKS_NAMESPACE)'
              command: 'upgrade'
              chartType: 'FilePath'
              chartPath: '$(HELM_CHART_PATH)'
              releaseName: '$(HELM_RELEASE_NAME)'
              install: true
              valueFile: '$(HELM_CHART_PATH)/values.yaml'
              waitForExecution: true
              arguments: >-
                -f $(HELM_CHART_PATH)/values-uat.yaml
                --set-string superset.image.repository=$(UAT_CONTAINER_NAMESPACE)/$(IMAGE_NAME)
                --set-string superset.image.tag=$(SOURCE_IMAGE_TAG)
                --timeout 10m

