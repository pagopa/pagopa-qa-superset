parameters:
  - name: DEPLOY_ENV
    displayName: Deploy ENV
    type: string
    default: dev
    values:
      - dev
      - uat
#      - prod

  - name: SOURCE_IMAGE_TAG
    displayName: 'Source image tag to promote and deploy (DEV -> UAT, UAT -> PROD)'
    type: string
    default: latest

variables:
  DEV_POOL_NAME: 'pagopa-dev-linux'
  UAT_POOL_NAME: 'pagopa-uat-linux'
  PROD_POOL_NAME: 'pagopa-prod-linux'

  IMAGE_NAME: 'pagopa-qa-superset'
  IMAGE_TAG: '$(Build.BuildId)'

  TRIVY_VERSION: '0.74.0'

  HELM_RELEASE_NAME: 'pagopa-qa-superset'
  HELM_CHART_PATH: 'helm'
  AKS_NAMESPACE: 'qa'

trigger: none

pr:
  branches:
    include:
      - main
      - develop

pool:
  vmImage: 'ubuntu-22.04'

stages:
  - stage: build_and_push_dev
    displayName: Build and Push [DEV]
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'dev')
    jobs:
      - job: buildPushDev
        displayName: Build and push DEV image

        steps:
          - checkout: self
            clean: true

          - script: git checkout $(SOURCE_BRANCH)
            displayName: Checkout source branch

          - task: AzureCLI@2
            displayName: Azure login to DEV ACR
            inputs:
              azureSubscription: '$(DEV_AZURE_SUBSCRIPTION)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name $(DEV_CONTAINER_NAMESPACE)

          - script: |
              set -euxo pipefail
              docker build \
                -t $(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):$(IMAGE_TAG) \
                -t $(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):latest \
                .
              docker push $(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):$(IMAGE_TAG)
              docker push $(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):latest
            displayName: Build and push DEV image

  - stage: trivy_scan_dev
    displayName: Trivy scan [DEV]
    dependsOn: build_and_push_dev
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'dev')
    jobs:
      - job: scanDevImage
        displayName: Scan the DEV image for vulnerabilities
        steps:
          - template: templates/steps-trivy-scan.yml
            parameters:
              azureSubscription: '$(DEV_AZURE_SUBSCRIPTION)'
              acrName: '$(DEV_CONTAINER_NAMESPACE)'
              image: '$(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):$(IMAGE_TAG)'
              trivyVersion: '$(TRIVY_VERSION)'
              continueOnError: true

  - stage: deploy_dev
    displayName: Deploy [DEV]
    dependsOn: trivy_scan_dev
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'dev')
    jobs:
      - job: helmDeployDev
        displayName: Helm upgrade on AKS DEV
        pool:
          name: '$(DEV_POOL_NAME)'
        steps:
          - template: templates/steps-helm-deploy.yml
            parameters:
              environmentName: dev
              kubernetesServiceConnection: '$(DEV_AKS_SERVICE_CONNECTION)'
              imageRepository: '$(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME)'
              imageTag: '$(IMAGE_TAG)'
              helmChartPath: '$(HELM_CHART_PATH)'
              helmReleaseName: '$(HELM_RELEASE_NAME)'
              aksNamespace: '$(AKS_NAMESPACE)'

  - stage: trivy_scan_uat
    displayName: Trivy scan [UAT]
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'uat')
    jobs:
      - job: scanUatSourceImage
        displayName: Scan the image to promote for vulnerabilities
        pool:
          name: '$(UAT_POOL_NAME)'
        steps:
          - template: templates/steps-trivy-scan.yml
            parameters:
              azureSubscription: '$(DEV_AZURE_SUBSCRIPTION)'
              acrName: '$(DEV_CONTAINER_NAMESPACE)'
              image: '$(DEV_CONTAINER_NAMESPACE)/$(IMAGE_NAME):${{ parameters.SOURCE_IMAGE_TAG }}'
              trivyVersion: '$(TRIVY_VERSION)'
              continueOnError: true

  - stage: promote_to_uat
    displayName: Promote image [UAT]
    dependsOn: trivy_scan_uat
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'uat')
    jobs:
      - job: promoteUat
        displayName: Promote DEV -> UAT
        pool:
          name: '$(UAT_POOL_NAME)'
        steps:
          - task: AzureCLI@2
            displayName: Pull image from DEV ACR
            inputs:
              azureSubscription: '$(DEV_AZURE_SUBSCRIPTION)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "${DEV_NS%%.*}"
                docker pull "${DEV_NS}/${IMG}:${SRC_TAG}"
            env:
              DEV_NS: $(DEV_CONTAINER_NAMESPACE)
              IMG: $(IMAGE_NAME)
              SRC_TAG: ${{ parameters.SOURCE_IMAGE_TAG }}

          - task: AzureCLI@2
            displayName: Push image to UAT ACR
            inputs:
              azureSubscription: '$(UAT_AZURE_SUBSCRIPTION)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "Pushing ${DEV_NS}/${IMG}:${SRC_TAG} -> ${UAT_NS}/${IMG}"

                az acr login --name "${UAT_NS%%.*}"
                docker tag "${DEV_NS}/${IMG}:${SRC_TAG}" "${UAT_NS}/${IMG}:${SRC_TAG}"
                docker tag "${DEV_NS}/${IMG}:${SRC_TAG}" "${UAT_NS}/${IMG}:latest"
                docker push "${UAT_NS}/${IMG}:${SRC_TAG}"
                docker push "${UAT_NS}/${IMG}:latest"
            env:
              DEV_NS: $(DEV_CONTAINER_NAMESPACE)
              IMG: $(IMAGE_NAME)
              SRC_TAG: ${{ parameters.SOURCE_IMAGE_TAG }}
              UAT_NS: $(UAT_CONTAINER_NAMESPACE)

  - stage: deploy_uat
    displayName: Deploy [UAT]
    dependsOn: promote_to_uat
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'uat')
    jobs:
      - job: helmDeployUat
        displayName: Helm upgrade on AKS UAT
        pool:
          name: '$(UAT_POOL_NAME)'
        steps:
          - template: templates/steps-helm-deploy.yml
            parameters:
              environmentName: uat
              kubernetesServiceConnection: '$(UAT_AKS_SERVICE_CONNECTION)'
              imageRepository: '$(UAT_CONTAINER_NAMESPACE)/$(IMAGE_NAME)'
              imageTag: '${{ parameters.SOURCE_IMAGE_TAG }}'
              helmChartPath: '$(HELM_CHART_PATH)'
              helmReleaseName: '$(HELM_RELEASE_NAME)'
              aksNamespace: '$(AKS_NAMESPACE)'

  - stage: trivy_scan_prod
    displayName: Trivy scan [PROD]
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'prod')
    jobs:
      - job: scanProdSourceImage
        displayName: Scan the image to promote for vulnerabilities
        pool:
          name: '$(PROD_POOL_NAME)'
        steps:
          - template: templates/steps-trivy-scan.yml
            parameters:
              azureSubscription: '$(UAT_AZURE_SUBSCRIPTION)'
              acrName: '$(UAT_CONTAINER_NAMESPACE)'
              image: '$(UAT_CONTAINER_NAMESPACE)/$(IMAGE_NAME):${{ parameters.SOURCE_IMAGE_TAG }}'
              trivyVersion: '$(TRIVY_VERSION)'
              continueOnError: true

  - stage: prod_approval
    displayName: Approval [PROD]
    dependsOn: trivy_scan_prod
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'prod')
    jobs:
      - job: prodApproval
        displayName: Wait for PROD approval
        pool: server
        steps:
          - task: ManualValidation@0
            displayName: Manual approval for production deployment
            timeoutInMinutes: 1440
            inputs:
              instructions: |
                Review the UAT promotion result and approve the production deployment.
                If the image is not ready, reject the deployment.
              onTimeout: 'reject'

  - stage: promote_to_prod
    displayName: Promote image [PROD]
    dependsOn: prod_approval
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'prod')
    jobs:
      - job: promoteProd
        displayName: Promote UAT -> PROD
        pool:
          name: '$(PROD_POOL_NAME)'
        steps:
          - task: AzureCLI@2
            displayName: Pull image from UAT ACR
            inputs:
              azureSubscription: '$(UAT_AZURE_SUBSCRIPTION)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name "${UAT_NS%%.*}"
                docker pull "${UAT_NS}/${IMG}:${SRC_TAG}"
            env:
              UAT_NS: $(UAT_CONTAINER_NAMESPACE)
              IMG: $(IMAGE_NAME)
              SRC_TAG: ${{ parameters.SOURCE_IMAGE_TAG }}

          - task: AzureCLI@2
            displayName: Push image to PROD ACR
            inputs:
              azureSubscription: '$(PROD_AZURE_SUBSCRIPTION)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                echo "Pushing ${UAT_NS}/${IMG}:${SRC_TAG} -> ${PROD_NS}/${IMG}"

                az acr login --name "${PROD_NS%%.*}"
                docker tag "${UAT_NS}/${IMG}:${SRC_TAG}" "${PROD_NS}/${IMG}:${SRC_TAG}"
                docker tag "${UAT_NS}/${IMG}:${SRC_TAG}" "${PROD_NS}/${IMG}:latest"
                docker push "${PROD_NS}/${IMG}:${SRC_TAG}"
                docker push "${PROD_NS}/${IMG}:latest"
            env:
              UAT_NS: $(UAT_CONTAINER_NAMESPACE)
              IMG: $(IMAGE_NAME)
              SRC_TAG: ${{ parameters.SOURCE_IMAGE_TAG }}
              PROD_NS: $(PROD_CONTAINER_NAMESPACE)

  - stage: deploy_prod
    displayName: Deploy [PROD]
    dependsOn: promote_to_prod
    condition: eq('${{ parameters.DEPLOY_ENV }}', 'prod')
    jobs:
      - job: helmDeployProd
        displayName: Helm upgrade on AKS PROD
        pool:
          name: '$(PROD_POOL_NAME)'
        steps:
          - template: templates/steps-helm-deploy.yml
            parameters:
              environmentName: prod
              kubernetesServiceConnection: '$(PROD_AKS_SERVICE_CONNECTION)'
              imageRepository: '$(PROD_CONTAINER_NAMESPACE)/$(IMAGE_NAME)'
              imageTag: '${{ parameters.SOURCE_IMAGE_TAG }}'
              helmChartPath: '$(HELM_CHART_PATH)'
              helmReleaseName: '$(HELM_RELEASE_NAME)'
              aksNamespace: '$(AKS_NAMESPACE)'