superset:
  image:
    repository: pagopaditncoreacr.azurecr.io/pagopa-qa-superset
    tag: latest
    pullPolicy: Always

  extraEnv:
    ENVIRONMENT: dev
    PAGOPA_QA_HUB_URL: https://pagopa-d-itn-qa-qa-hub-wa.azurewebsites.net/

  config:
    ROW_LIMIT: 50000
    SUPERSET_WEBSERVER_TIMEOUT: 300
    # In dev conviene vedere gli errori applicativi.
    WTF_CSRF_ENABLED: true

  # Solo in dev: carica i dataset/dashboard di esempio e li mette sullo stesso db
  configOverrides:
    pagopa-dev-examples: |
      SQLALCHEMY_EXAMPLES_URI = SQLALCHEMY_DATABASE_URI

  init:
    createAdmin: false
    loadExamples: true
    command:
      - "/bin/sh"
      - "-c"
      - >
        . {{ .Values.configMountPath }}/superset_bootstrap.sh;
        . {{ .Values.configMountPath }}/superset_init.sh;
        superset fab create-admin
        --username "$SUPERSET_ADMIN_USER"
        --firstname PagoPA --lastname Admin
        --email admin@pagopa.it
        --password "$SUPERSET_ADMIN_PSW"
        || true

  supersetNode:
    replicas:
      replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi

  supersetWorker:
    replicas:
      replicaCount: 1
    command:
      - "/bin/sh"
      - "-c"
      - >
        . {{ .Values.configMountPath }}/superset_bootstrap.sh;
        python -c "import os, duckdb; duckdb.sql(f\"CREATE OR REPLACE PERSISTENT SECRET dqf_blob (TYPE azure, CONNECTION_STRING 'BlobEndpoint=https://pagopauitnqadqfsa.blob.core.windows.net;SharedAccessSignature={os.environ['DQF_BLOB_SAS'].lstrip('?')}')\")";
        exec celery --app=superset.tasks.celery_app:app worker
        --loglevel=INFO
        --concurrency=2
        --max-tasks-per-child=100
        --max-memory-per-child=300000
    resources:
      requests:
        cpu: 100m
        memory: 768Mi
      limits:
        memory: 1536Mi

  ingress:
    hosts:
      - qa-superset.itn.internal.dev.platform.pagopa.it
    tls:
      - secretName: qa-superset-itn-internal-dev-platform-pagopa-it
        hosts:
          - qa-superset.itn.internal.dev.platform.pagopa.it

  envSecret:
    DQF_BLOB_SAS: "dqf-data-sas-token"

  keyvault:
    name: "pagopa-d-itn-qa-kv"
    tenantId: "7788edaf-0346-4068-9d79-c868aed15b3d"
